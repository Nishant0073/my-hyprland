# animations {
#   enabled = yes
#
#   # macOS-like bezier curves
#   bezier = macIn,    0.18, 1.00, 0.22, 1.00
#   bezier = macOut,   0.19, 0.00, 0.00, 1.00
#   bezier = macSlide, 0.22, 0.61, 0.36, 1.00
#   bezier = macFade,  0.4,  0.0,  0.6,  1.0
#   bezier = macSmooth,0.25, 0.1,  0.25, 1.00
#
#   # window animations
#   animation = windows,     1, 6, macIn, slide
#   animation = windowsIn,   1, 5, macIn, slide
#   animation = windowsOut,  1, 4, macOut, slide
#   animation = windowsMove, 1, 5, macSlide, slide
#
#   # fade + border
#   animation = fade,        1, 4, macFade
#   animation = border,      1, 2, macSmooth
#
#   # workspace transitions (horizontal macOS-style)
#   animation = workspaces,    1, 6, macSlide, slide
#   animation = workspacesIn,  1, 6, macIn, slide
#   animation = workspacesOut, 1, 6, macOut, slide
# }
#
animations {
  enabled = yes

  # macOS-style bezier curves
  bezier = macIn,      0.18, 1.00, 0.22, 1.00     # smooth accelerate
  bezier = macOut,     0.19, 0.00, 0.00, 1.00     # gentle overshoot decel
  bezier = macSlide,   0.22, 0.61, 0.36, 1.00     # workspace sliding
  bezier = macFade,    0.40, 0.00, 0.60, 1.00     # opacity easing
  bezier = macSmooth,  0.25, 0.10, 0.25, 1.00     # border + misc
  bezier = macBorder,  0.30, 0.00, 0.20, 1.00     # subtle border damping

  # Window lifecycle
  animation = windows,       1, 6, macIn, slide
  animation = windowsIn,     1, 5, macIn, slide
  animation = windowsOut,    1, 6, macOut, slide
  animation = windowsMove,   1, 7, macSlide, slide

  # Fade + border
  animation = fade,          1, 5, macFade
  animation = border,        1, 3, macBorder

  # Workspace transitions
  animation = workspaces,    1, 7, macSlide, slide
  animation = workspacesIn,  1, 7, macIn, slide
  animation = workspacesOut, 1, 7, macOut, slide
}


# ============================
# GENERAL (window geometry)
# ============================
general {
  border_size = 2
  gaps_in = 4
  gaps_out = 8

  # Active/inactive borders should not overpower shadows.
  col.active_border = $color12
  col.inactive_border = $color10

  # Better stacking behavior
  no_focus_fallback = true
}

# ============================
# DECORATION (macOS-like polish)
# ============================
decoration {
  rounding = 10

  # These align with dual opacity + dimming strategy
  active_opacity = 1.0
  inactive_opacity = 0.92
  fullscreen_opacity = 1.0

  # Dim inactive windows (macOS mission control effect)
  dim_inactive = true
  dim_strength = 0.08
  dim_special = 0.75

  # Shadows tuned for blur + rounding combo
  shadow {
    enabled = true
    range = 4             # Show shadow outside
    render_power = 3       # Softer + richer shadows
    color = $color12
    color_inactive = $color10
  }

  # ============================
  # BLUR (fast + crisp text)
  # ============================
  blur {
    enabled = true
    size = 8               # Increasing size improves falloff
    passes = 2             # 3 = heavier, 2 = clean & crisp
    ignore_opacity = true
    new_optimizations = true
    special = true         # for popups (PIP + notifications)
    popups = true
    vibrancy = 0.18        # subtle translucency (macOS effect)
    contrast = 0.9         # keeps text readable
    brightness = 1.0
  }
}

# ============================
# GROUP SETTINGS (tabbed groups)
# ============================
group {
  col.border_active = $color15

  groupbar {
    col.active = $color0
    col.inactive = $color10
    font_size = 2          # hide label, more minimal
    rounding = 6
  }
}

